<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ankiquest</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#101418">
<style>
:root {
  --bg: #f4f1ea; --card: #fffdf8; --ink: #1d2327; --dim: #6b7278; --line: #e2dccf;
  --accent: #2f7dd1; --gold: #d99a1c; --fire: #e2582b; --ice: #5bb5d8; --ok: #3d9a5f;
  --h0: #e6e0d3; --h1: #b9d7f2; --h2: #7fb6e8; --h3: #3f8dd8; --h4: #1d5fa8;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101418; --card: #181e24; --ink: #e8e6e1; --dim: #8b949c; --line: #28313a;
    --accent: #5aa5f0; --gold: #f0b840; --fire: #ff7a4a; --ice: #7fd0ee; --ok: #5cc483;
    --h0: #222b33; --h1: #1d3f5e; --h2: #235d92; --h3: #2f7dd1; --h4: #6bb6ff;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 16px 16px calc(32px + env(safe-area-inset-bottom));
}
main { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
header a { color: var(--dim); font-size: 14px; text-decoration: none; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 0 0 12px; font-weight: 600; }
h2 .sub { text-transform: none; letter-spacing: 0; font-weight: 400; }
.hero { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.level {
  width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center;
  border: 4px solid var(--gold); font-weight: 700; font-size: 28px; font-variant-numeric: tabular-nums;
}
.level small { display: block; font-size: 10px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: -6px; text-align: center; }
.name { font-size: 22px; font-weight: 700; }
.bar { height: 10px; border-radius: 5px; background: var(--h0); overflow: hidden; margin-top: 6px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 5px; transition: width 0.6s ease; }
.bar.gold > i { background: var(--gold); }
.bar.ok > i { background: var(--ok); }
.sub { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { text-align: center; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--dim); }
.fire b { color: var(--fire); }
.ice b { color: var(--ice); }
.risk { border-color: var(--fire); color: var(--fire); font-weight: 600; text-align: center; }
.quest { display: grid; gap: 2px; margin-bottom: 12px; }
.quest:last-child { margin-bottom: 0; }
.quest .row { display: flex; justify-content: space-between; gap: 8px; }
.quest.done .title { color: var(--ok); }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; }
.heat i { width: 100%; min-width: 9px; aspect-ratio: 1; border-radius: 2px; background: var(--h0); }
.heat i.l1 { background: var(--h1); } .heat i.l2 { background: var(--h2); }
.heat i.l3 { background: var(--h3); } .heat i.l4 { background: var(--h4); }
.heat i.frozen { background: var(--ice); opacity: 0.55; }
.heat i.pad { visibility: hidden; }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.ach div { border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 13px; }
.ach div.locked { opacity: 0.55; }
.ach div.got { border-color: var(--gold); }
.ach b { display: block; font-size: 14px; }
.ach .bar { height: 5px; }
.board { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.board li { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px 10px 6px; border-radius: 14px; }
.board li.me { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.board li.lead { background: color-mix(in srgb, var(--gold) 12%, transparent); }
.board li.lead.me { background: color-mix(in srgb, var(--gold) 12%, color-mix(in srgb, var(--accent) 14%, transparent)); }
.board .rank { font-size: 19px; text-align: center; color: var(--dim); font-weight: 600; font-variant-numeric: tabular-nums; }
.board .line { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.board .name { font-weight: 600; color: inherit; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .name:hover { text-decoration: underline; }
.board .streak { font-size: 12px; color: var(--fire); white-space: nowrap; }
.board .lvl { font-size: 12px; color: var(--gold); white-space: nowrap; margin-left: auto; font-variant-numeric: tabular-nums; }
.board .bar { height: 5px; margin-top: 7px; }
.board .xp { text-align: right; font-variant-numeric: tabular-nums; min-width: 64px; }
.board .xp b { display: block; font-size: 17px; color: var(--accent); }
.board .xp span { font-size: 11px; color: var(--dim); white-space: nowrap; }
.records { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 10px; }
.record { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 13px; }
.record h3 {
  margin: 0 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--dim); display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.record h3 em { font-style: normal; text-transform: none; letter-spacing: 0; font-weight: 400; white-space: nowrap; }
.record .entry { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto auto; gap: 8px; align-items: baseline; }
.record .entry + .entry { margin-top: 7px; }
.record .place { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; text-align: center; }
.record .entry a { color: inherit; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.record .entry a:hover { text-decoration: underline; }
.record .value { font-variant-numeric: tabular-nums; }
.record .value small { color: var(--dim); font-size: 11px; margin-left: 3px; }
.record .lead { font-size: 17px; font-weight: 700; }
.record .lead .place { font-size: 15px; }
.record .lead .value { color: var(--gold); }
.record .lead .value small { font-weight: 400; }
.record .chase { font-size: 13px; color: var(--dim); }
.record .chase .value { color: var(--ink); font-weight: 600; }
.record .bar { grid-column: 1 / -1; height: 6px; margin-top: 5px; }
.record .detail { color: var(--dim); font-size: 12px; margin-top: 3px; padding-left: 28px; }
.record .mine a { color: var(--accent); font-weight: 700; }
.empty { color: var(--dim); text-align: center; padding: 24px 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.tabs a { font-size: 12px; padding: 5px 11px; border-radius: 999px; background: var(--h0); color: var(--dim); text-decoration: none; }
.tabs a.on { background: var(--accent); color: var(--card); font-weight: 600; }
.deck-sharing button, .deck-sharing input { font: inherit; }
.deck-sharing button { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
.deck-sharing button:disabled { opacity: 0.55; cursor: default; }
dialog.deck-sharing { width: min(560px, calc(100% - 32px)); max-height: 85vh; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); }
dialog.deck-sharing::backdrop { background: #0008; }
.deck-sharing h3 { margin: 0; font-size: 18px; }
.deck-sharing .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
.deck-sharing input[type=password] { width: 100%; margin-top: 6px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
.deck-sharing fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 14px 0; padding: 12px; min-width: 0; }
.behind { color: var(--dim); }
.deck-sharing .fold { background: none; border: 0; color: inherit; cursor: pointer; font: inherit; padding: 0 4px; }
.deck-sharing legend { font-weight: 600; overflow-wrap: anywhere; }
.deck-sharing label { display: block; margin: 8px 0; overflow-wrap: anywhere; }
.deck-sharing input[type=checkbox] { margin-right: 8px; accent-color: var(--accent); }
.deck-sharing .recipients { margin: 12px 0 0 20px; }
.deck-sharing .apply-subdecks { margin-top: 8px; }
.deck-sharing .error { color: var(--fire); }
.freeze-panel { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
.freeze-heading { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.freeze-heading h3 { display: flex; gap: 8px; align-items: center; margin: 0; font-size: 14px; }
.freeze-badge { padding: 2px 7px; border-radius: 999px; background: color-mix(in srgb, var(--ice) 15%, transparent); color: var(--ink); font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.freeze-panel[data-state=off] .freeze-badge { color: var(--dim); background: var(--h0); }
.freeze-main { display: flex; gap: 16px; align-items: center; margin-top: 8px; }
.freeze-main strong { font-size: 14px; font-variant-numeric: tabular-nums; }
.freeze-main p { margin: 3px 0 0; font-size: 12px; color: var(--dim); }
.freeze-display { display: flex; flex-shrink: 0; gap: 4px; }
.freeze-slot { width: 38px; height: 52px; display: grid; place-items: center; }
.freeze-slot svg { width: 36px; height: 46px; overflow: visible; }
.freeze-slot .shell { fill: color-mix(in srgb, var(--ice) 5%, var(--card)); stroke: var(--line); stroke-width: 1.6; stroke-dasharray: 3 3; }
.freeze-slot .facet, .freeze-slot .flame, .freeze-slot .glint { opacity: 0; }
.freeze-slot.filled { background: radial-gradient(ellipse, #50beef25, transparent 70%); }
.freeze-slot.filled .shell { fill: #259dd9; stroke: #1575ae; stroke-dasharray: none; }
.freeze-slot.filled .facet, .freeze-slot.filled .flame, .freeze-slot.filled .glint { opacity: 1; }
.freeze-slot .facet-left { fill: #70d9fa; }
.freeze-slot .facet-top { fill: #b3efff; }
.freeze-slot .facet-right { fill: #1382c7; }
.freeze-slot .flame { fill: #edfcff; }
.freeze-slot .glint { fill: none; stroke: white; stroke-width: 1.4; stroke-linecap: round; }
.freeze-display.off .filled { filter: saturate(0.35); opacity: 0.65; }
.freeze-button, .freeze-settings input { font: inherit; }
.freeze-button { min-height: 44px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--card); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }
.freeze-button:hover { border-color: var(--accent); }
.freeze-button:focus-visible, .freeze-settings input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.freeze-button:disabled { cursor: default; opacity: 0.55; }
.freeze-button.primary { background: #246bb3; border-color: #246bb3; color: #fff; }
dialog.freeze-settings { width: min(480px, calc(100% - 32px)); max-height: 85vh; padding: 22px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); }
dialog.freeze-settings::backdrop { background: #0008; }
.freeze-settings h3 { margin: 0; font-size: 20px; letter-spacing: -0.02em; }
.freeze-settings .intro { margin: 4px 0 16px; color: var(--dim); font-size: 13px; overflow-wrap: anywhere; }
.freeze-settings .rules { display: grid; gap: 10px; margin: 0 0 18px; padding-left: 20px; font-size: 13px; }
.freeze-settings .rules li::marker { color: var(--ice); }
.freeze-settings .token-label { display: block; font-size: 13px; font-weight: 600; }
.freeze-settings input[type=password] { width: 100%; margin-top: 6px; padding: 11px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink); }
.freeze-settings .token-help { margin: 8px 0 12px; font-size: 12px; color: var(--dim); }
.freeze-settings .freeze-balance { display: flex; gap: 16px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
.freeze-settings .freeze-balance strong { display: block; font-size: 16px; }
.freeze-settings .freeze-toggle { display: flex; gap: 12px; align-items: center; padding: 14px; margin: 6px 0 14px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.freeze-settings .freeze-toggle input { width: 20px; height: 20px; flex-shrink: 0; accent-color: var(--accent); }
.freeze-settings .freeze-toggle strong { display: block; font-size: 14px; }
.freeze-settings .freeze-toggle small { display: block; margin-top: 2px; color: var(--dim); font-size: 12px; }
.freeze-settings .actions { display: flex; justify-content: flex-end; margin-top: 12px; }
.freeze-settings .status { min-height: 20px; margin: 12px 0 0; font-size: 13px; color: var(--dim); }
.freeze-settings .status.error { color: var(--fire); }
@media (max-width: 420px) {
  .freeze-main, .freeze-settings .freeze-balance { gap: 10px; }
  .freeze-slot { width: 30px; }
  .freeze-slot svg { width: 30px; }
  dialog.freeze-settings { padding: 18px; }
}
</style>
</head>
<body>
<main id="app"><p class="empty">Loading</p></main>
<dialog id="deck-sharing" class="deck-sharing" aria-labelledby="deck-sharing-title"></dialog>
<dialog id="streak-freezes" class="freeze-settings" aria-labelledby="freeze-title" aria-describedby="freeze-intro"></dialog>
<script>
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = n => n.toLocaleString();
const pct = (a, b) => b ? Math.min(100, Math.round(a / b * 100)) : 0;

let weekEnds = 0;
let renderId = 0;
const settingsOpen = () => document.getElementById("deck-sharing").open || document.getElementById("streak-freezes").open;
const PERIODS = { hour: "This hour", day: "Today", week: "This week", month: "This month", year: "This year", all: "All time" };

const WINDOWS = { hour: "Best hour", day: "Best day", week: "Best week", month: "Best month", year: "Best year" };
const RECORDS = { ...WINDOWS, streak: "Longest streak", days: "Days studied" };
const SINCE = { streak: "ended", days: "since" };

function currentView() {
  const name = location.pathname.replace(/\/+$/, "").split("/").pop();
  if (name === "records") return "records";
  return name in PERIODS ? name : "week";
}

function currentPeriod() {
  const view = currentView();
  return view === "records" ? "week" : view;
}

function tabs(active) {
  const links = Object.entries(PERIODS).map(([name, label]) =>
    `<a class="${name === active ? "on" : ""}" href="/${name}${location.hash}">${label}</a>`);
  links.push(`<a class="${active === "records" ? "on" : ""}" href="/records${location.hash}">Records</a>`);
  return `<nav class="tabs">${links.join("")}</nav>`;
}

function records(rows, me) {
  const held = Object.fromEntries(rows.map(row => [row.window, row]));
  if (!rows.some(row => (row.holders ?? []).length)) return `<p class="empty">Nobody has earned any XP yet.</p>`;
  return `<div class="records">${Object.entries(RECORDS).map(([window, label]) => {
    const row = held[window];
    const [best, ...rest] = row?.holders ?? [];
    if (!best) return "";
    const unit = row.unit === "days" ? "days" : "XP";
    const when = new Date(best.at).toLocaleDateString([], { year: "numeric", month: "short", day: "numeric" });
    const entry = (holder, place, lead) => `
      <div class="entry ${lead ? "lead" : "chase"}${holder.user === me ? " mine" : ""}">
        <span class="place">${place}</span>
        <a href="#${encodeURIComponent(holder.user)}">${esc(holder.display)}</a>
        <span class="value">${num(holder.value)}${lead ? `<small>${unit}</small>` : ""}</span>
        <span class="behind">${lead ? "" : `−${num(best.value - holder.value)}`}</span>
        <div class="bar${lead ? " gold" : ""}"><i style="width:${pct(holder.value, best.value)}%"></i></div>
      </div>`;
    return `<article class="record">
      <h3>${label}<em>${SINCE[window] ? `${SINCE[window]} ${when}` : when}</em></h3>
      ${entry(best, "🏆", true)}
      ${best.detail ? `<div class="detail">${num(best.detail)} reviews</div>` : ""}
      ${rest.map((holder, index) => entry(holder, index + 2, false)).join("")}
    </article>`;
  }).join("")}</div>`;
}

function bests(player) {
  const windows = Object.entries(WINDOWS).map(([window, label]) => {
    const record = player.records?.[window] ?? { xp: 0, reviews: 0 };
    return `<div class="stat"><b>${num(record.xp)}</b><span>${label.toLowerCase()} · ${num(record.reviews)} reviews</span></div>`;
  });
  windows.push(`<div class="stat"><b>${player.lifetime.best_streak}</b><span>longest streak</span></div>`);
  windows.push(`<div class="stat"><b>${num(player.lifetime.days_active)}</b><span>days studied</span></div>`);
  return `<div class="stats">${windows.join("")}</div>`;
}

function boardTitle(period) {
  if (period !== "week") return PERIODS[period];
  const left = weekEnds - Date.now();
  if (left <= 0) return "This week";
  const h = Math.floor(left / 3600000), d = Math.floor(h / 24);
  const when = new Date(weekEnds).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
  return `This week · resets in ${d ? `${d}d ${h % 24}h` : h ? `${h}h` : "<1h"}<span class="sub"> · ${when}</span>`;
}

function board(rows, me) {
  if (!rows.length) return `<p class="empty">Nobody has uploaded reviews yet.</p>`;
  if (rows.every(row => (row.xp ?? row.week_xp) === 0)) return `<p class="empty">No XP in this period yet.</p>`;
  const xpOf = row => row.xp ?? row.week_xp;
  const lead = Math.max(1, xpOf(rows[0]));
  return `<ol class="board">${rows.map((r, i) => `
    <li class="${[r.user === me && "me", i === 0 && r.week_xp > 0 && "lead"].filter(Boolean).join(" ")}">
      <span class="rank">${["👑", "🥈", "🥉"][i] ?? i + 1}</span>
      <div>
        <div class="line">
          <a class="name" href="#${encodeURIComponent(r.user)}">${esc(r.display)}</a>
          ${r.streak > 0 ? `<span class="streak">🔥${r.streak}</span>` : ""}
          <span class="lvl">Lv ${r.level}</span>
        </div>
        <div class="bar"><i style="width:${pct(xpOf(r), lead)}%"></i></div>
      </div>
      <div class="xp"><b>${num(xpOf(r))}</b><span>${num(r.today_reviews)} today</span></div>
    </li>`).join("")}
  </ol>`;
}

function heat(cells) {
  const max = Math.max(1, ...cells.map(c => c.reviews));
  const first = new Date(cells[0].date + "T00:00:00Z");
  const pad = (first.getUTCDay() + 6) % 7;
  const level = n => n === 0 ? 0 : Math.min(4, 1 + Math.floor(n / max * 3.999));
  return "<i class='pad'></i>".repeat(pad) + cells.map(c =>
    `<i class="${c.frozen ? "frozen" : "l" + level(c.reviews)}" title="${c.date}: ${c.frozen ? "streak freeze" : num(c.reviews) + " reviews, " + num(c.xp) + " XP"}"></i>`).join("");
}

const freezeCount = value => Math.max(0, Math.min(3, Math.floor(Number(value) || 0)));

function freezeSlots(count, enabled) {
  return `<div class="freeze-display${enabled ? "" : " off"}" role="img" aria-label="${count} of 3 streak freezes ${enabled ? "ready" : "saved; protection off"}">
    ${Array.from({ length: 3 }, (_, i) => `<span class="freeze-slot${i < count ? " filled" : ""}">
      <svg viewBox="0 0 40 48" aria-hidden="true" focusable="false">
        <path class="shell" d="M20 2 33 11 36 30 26 44H14L4 30 7 11Z"/>
        <path class="facet facet-left" d="M20 2 16 17 14 44 4 30 7 11Z"/>
        <path class="facet facet-top" d="M20 2 33 11 25 17 16 17 7 11Z"/>
        <path class="facet facet-right" d="m25 17 8-6 3 19-10 14-2-12Z"/>
        <path class="flame" d="M21 13c2 7-6 9-3 14 2-1 4-4 4-6 5 4 7 7 5 12-2 5-10 7-14 2-5-6 3-11 4-15 1 2 1 3 1 4 3-3 2-7 3-11Z"/>
        <path class="glint" d="m10 12 6-5m-6 9-1 6m18 15-3 4"/>
      </svg>
    </span>`).join("")}
  </div>`;
}

function streakFreezes(player) {
  const count = freezeCount(player.stored_freezes ?? player.freezes), enabled = player.freezes_enabled === true;
  const state = !enabled ? "off" : count === 3 ? "full" : count ? "ready" : "empty";
  const badge = !enabled ? "Off" : count === 3 ? "Full" : "On";
  const title = enabled ? `${count} of 3 freezes ready` : count ? `${count} of 3 freezes saved` : "A little backup for your streak";
  const detail = !enabled
    ? count ? "Protection is off. Your saved freezes are kept." : "Opt in, then finish all three daily quests to earn a freeze."
    : count === 3 ? player.freeze_earned_today ? "You earned a freeze today. You're fully stocked." : "Fully stocked. Each freeze can protect one missed Anki day."
    : player.freeze_earned_today ? "You earned a freeze today. Earn another with tomorrow's quests."
    : player.quests.length > 0 && player.quests.every(quest => quest.done) ? "Today's quests are already complete. Earn a freeze with tomorrow's quests."
    : "Finish all three daily quests to earn one freeze. At most one per day.";
  return `<div class="freeze-panel" data-state="${state}">
    <div class="freeze-heading"><h3>Streak freezes <span class="freeze-badge">${badge}</span></h3>
      <button type="button" id="manage-freezes" class="freeze-button">Manage streak freezes</button></div>
    <div class="freeze-main">${freezeSlots(count, enabled)}<div><strong>${title}</strong><p>${detail}</p></div></div>
  </div>`;
}

function view(p, rows) {
  const unlocked = p.achievements.filter(a => a.unlocked).length;
  const achievements = [...p.achievements].sort((a, b) => !!b.unlocked - !!a.unlocked || pct(b.progress, b.target) - pct(a.progress, a.target));
  return `
<header><h1>ankiquest</h1><a href="#">Leaderboard</a></header>
<section class="hero">
  <div class="level"><div><small>Level</small>${p.level}</div></div>
  <div>
    <div class="name">${esc(p.display)}</div>
    <div class="bar gold"><i style="width:${pct(p.xp_into_level, p.xp_for_next)}%"></i></div>
    <div class="sub">${num(p.xp_into_level)} / ${num(p.xp_for_next)} XP to level ${p.level + 1} · ${num(p.xp_total)} total</div>
  </div>
</section>
<section class="deck-sharing"><h2>Deck completion notifications</h2>
  <p class="sub">Choose who hears when you finish a deck for the day. Off by default for every deck.</p>
  <button type="button" id="manage-decks">Manage deck notifications</button>
</section>
${p.at_risk ? `<section class="risk">Your ${p.streak} day streak is waiting for today's reviews.</section>` : ""}
<section class="stats">
  <div class="stat fire"><b>${p.streak}</b><span>day streak</span></div>
  <div class="stat ice"><b>${freezeCount(p.stored_freezes ?? p.freezes)}/3</b><span>${p.freezes_enabled ? "freezes ready" : "freezes paused"}</span></div>
  <div class="stat"><b>${num(p.today.reviews)}</b><span>reviews today</span></div>
  <div class="stat"><b>${num(p.today.xp)}</b><span>XP today</span></div>
</section>
<section><h2>Daily quests</h2>${p.quests.map(q => `
  <div class="quest ${q.done ? "done" : ""}">
    <div class="row"><span class="title">${q.done ? "✓ " : ""}${esc(q.title)}</span><span class="sub">${num(q.progress)} / ${num(q.target)} · +${q.reward} XP</span></div>
    <div class="bar ${q.done ? "ok" : ""}"><i style="width:${pct(q.progress, q.target)}%"></i></div>
  </div>`).join("")}
  <div class="sub">Finish all three for a +100 XP bonus.</div>
  ${streakFreezes(p)}
</section>
<section><h2>Last 26 weeks</h2><div class="heat">${heat(p.heatmap)}</div></section>
<section><h2>${boardTitle(currentPeriod())}</h2>${tabs(currentPeriod())}${board(rows, p.user)}</section>
<section><h2>Personal bests</h2>${bests(p)}</section>
<section><h2>Lifetime</h2><div class="stats">
  <div class="stat"><b>${num(p.lifetime.reviews)}</b><span>reviews</span></div>
  <div class="stat"><b>${num(p.lifetime.hours)}</b><span>hours</span></div>
  <div class="stat"><b>${p.lifetime.best_streak}</b><span>best streak</span></div>
  <div class="stat"><b>${num(p.lifetime.best_combo)}</b><span>best combo</span></div>
</div></section>
<section><h2>Achievements · ${unlocked} / ${p.achievements.length}</h2><div class="ach">${achievements.map(a => `
  <div class="${a.unlocked ? "got" : "locked"}"><b>${esc(a.title)}</b>${esc(a.description)}
    ${a.unlocked ? `<div class="sub">${a.unlocked} · +${a.reward} XP</div>` : `<div class="bar"><i style="width:${pct(a.progress, a.target)}%"></i></div>`}
  </div>`).join("")}</div>
</section>`;
}

function openDeckSharing(user, display) {
  if (settingsOpen()) return;
  renderId++;
  const dialog = document.getElementById("deck-sharing");
  let token = "";
  let closed = false;
  const controller = new AbortController();
  dialog.innerHTML = `<h3 id="deck-sharing-title">Deck notifications · ${esc(display)}</h3>
    <p class="sub">Notify selected people once per deck each Anki day, after you finish all scheduled cards, including learning cards due later today.</p>
    <div id="deck-sharing-content"><form id="deck-unlock">
      <label for="deck-token">Your AnkiQuest token</label>
      <input id="deck-token" type="password" required autocomplete="off" spellcheck="false" aria-describedby="deck-token-help">
      <p id="deck-token-help" class="sub">Use the token from your AnkiQuest settings. It is kept only while this window is open.</p>
      <button type="submit">Load my decks</button>
    </form></div>
    <p id="deck-status" role="status" aria-live="polite"></p>
    <div class="actions"><button type="button" id="deck-close">Close</button></div>`;
  const content = dialog.querySelector("#deck-sharing-content");
  const status = dialog.querySelector("#deck-status");
  const say = (message, error = false) => {
    status.textContent = message;
    status.className = error ? "error" : "sub";
  };
  const request = async (body) => {
    const response = await fetch("/api/decks/" + encodeURIComponent(user), {
      method: body ? "POST" : "GET",
      headers: { "Authorization": "Bearer " + token, ...(body ? { "Content-Type": "application/json" } : {}) },
      ...(body ? { body: JSON.stringify(body) } : {}),
      cache: "no-store", signal: controller.signal,
    });
    if (!response.ok) {
      if (response.status === 401) throw new Error("The token was not accepted for this player. Close and reopen this window to try again.");
      if (response.status === 400 || response.status === 404) throw new Error("The deck or recipient list has changed. Close and reopen this window to refresh it.");
      throw new Error("Could not save or load deck notifications. Please try again.");
    }
    return response.json();
  };
  const showDecks = data => {
    data.decks.sort((a, b) => {
      const left = a.name.split("::"), right = b.name.split("::");
      for (let i = 0; i < Math.min(left.length, right.length); i++) {
        const order = left[i].localeCompare(right[i], undefined, { sensitivity: "base" });
        if (order) return order;
      }
      return left.length - right.length;
    });
    const subdecks = deck => data.decks.map((other, i) => other.name.startsWith(deck.name + "::") ? i : -1).filter(i => i >= 0);
    const collapsed = new Set();
    content.innerHTML = `<form id="deck-settings">
      ${data.decks.length ? "" : `<p>No decks have been uploaded yet. Open an updated AnkiQuest client and sync your reviews, then reopen this window. Nudges work without them.</p>`}
      ${data.decks.map((deck, index) => `<fieldset data-deck="${index}" style="margin-left:${(deck.name.split("::").length - 1) * 14}px">
        <legend>${subdecks(deck).length ? `<button type="button" class="fold" aria-expanded="true">▾</button> ` : ""}<span title="${esc(deck.name)}">${esc(deck.name.split("::").pop())}</span></legend>
        <label><input type="checkbox" class="deck-enabled" ${deck.enabled ? "checked" : ""}>Notify people when I finish this deck</label>
        <div class="recipients" ${deck.enabled ? "" : "hidden"}>
          <span class="sub">Notify these people:</span>
          ${data.recipients.map((person, i) => `<label><input type="checkbox" data-recipient="${i}" ${deck.recipients.includes(person.user) ? "checked" : ""}>${esc(person.display)}${person.display !== person.user ? ` <span class="sub">(${esc(person.user)})</span>` : ""}</label>`).join("") || `<p class="sub">No other players are available yet.</p>`}
        </div>
        ${subdecks(deck).length ? `<button type="button" class="apply-subdecks">Apply to ${subdecks(deck).length === 1 ? "its subdeck" : `all ${subdecks(deck).length} subdecks`}</button>` : ""}
      </fieldset>`).join("")}
      <fieldset id="nudge-settings">
        <legend>Nudges</legend>
        <label><input type="checkbox" id="nudge-enabled" ${data.nudges ? "checked" : ""}>Nudge me when a place, a personal best or a level is within reach</label>
        <p class="sub">At most one of each a day, while you are awake and have already studied.</p>
      </fieldset>
      ${data.decks.length ? `<p class="sub">Only selected people receive your name and the deck name. Changes apply to future completions.</p>` : ""}
      <button type="submit">Save preferences</button>
    </form>`;
    const form = content.querySelector("form");
    const fields = form.querySelectorAll("fieldset[data-deck]");
    const refold = () => fields.forEach((field, i) => {
      field.hidden = [...collapsed].some(name => data.decks[i].name.startsWith(name + "::"));
      const fold = field.querySelector(".fold");
      if (!fold) return;
      const folded = collapsed.has(data.decks[i].name);
      fold.textContent = folded ? "▸" : "▾";
      fold.setAttribute("aria-expanded", folded ? "false" : "true");
    });
    fields.forEach((field, i) => field.querySelector(".fold")?.addEventListener("click", () => {
      const name = data.decks[i].name;
      if (!collapsed.delete(name)) collapsed.add(name);
      refold();
    }));
    form.querySelectorAll("fieldset[data-deck]").forEach(field => {
      field.querySelector(".deck-enabled").addEventListener("change", event => {
        field.querySelector(".recipients").hidden = !event.target.checked;
        say("Unsaved changes.");
      });
      field.querySelectorAll("[data-recipient]").forEach(input => input.addEventListener("change", () => say("Unsaved changes.")));
      field.querySelector(".apply-subdecks")?.addEventListener("click", () => {
        const enabled = field.querySelector(".deck-enabled").checked;
        const chosen = [...field.querySelectorAll("[data-recipient]")].map(input => input.checked);
        const fields = form.querySelectorAll("fieldset[data-deck]");
        for (const i of subdecks(data.decks[Number(field.dataset.deck)])) {
          const target = fields[i];
          target.querySelector(".deck-enabled").checked = enabled;
          target.querySelector(".recipients").hidden = !enabled;
          target.querySelectorAll("[data-recipient]").forEach((input, r) => { input.checked = chosen[r]; });
        }
        say("Copied to subdecks. Save to keep it.");
      });
    });
    form.querySelector("#nudge-enabled").addEventListener("change", () => say("Unsaved changes."));
    form.addEventListener("submit", async event => {
      event.preventDefault();
      const decks = [...form.querySelectorAll("fieldset[data-deck]")].map((field, i) => ({
        id: data.decks[i].id,
        enabled: field.querySelector(".deck-enabled").checked,
        recipients: [...field.querySelectorAll("[data-recipient]:checked")].map(input => data.recipients[Number(input.dataset.recipient)].user),
      }));
      const invalid = decks.findIndex(deck => deck.enabled && !deck.recipients.length);
      if (invalid >= 0) {
        say(`Select at least one person for ${data.decks[invalid].name}, or turn its notifications off.`, true);
        form.querySelectorAll("fieldset[data-deck]")[invalid].querySelector(".deck-enabled").focus();
        return;
      }
      const controls = [...form.querySelectorAll("input, button")];
      controls.forEach(control => { control.disabled = true; });
      say("Saving…");
      try {
        await request({ decks, nudges: form.querySelector("#nudge-enabled").checked });
        if (!closed) say("Preferences saved.");
      } catch (error) {
        if (!closed) say(error.message, true);
      } finally {
        controls.forEach(control => { control.disabled = false; });
      }
    });
  };
  content.querySelector("form").addEventListener("submit", async event => {
    event.preventDefault();
    token = dialog.querySelector("#deck-token").value.trim();
    const button = event.target.querySelector("button");
    button.disabled = true;
    say("Loading decks…");
    try {
      const data = await request();
      if (!closed) { showDecks(data); say(""); }
    } catch (error) {
      if (!closed) say(error.message, true);
    } finally {
      button.disabled = false;
    }
  });
  dialog.querySelector("#deck-close").addEventListener("click", () => dialog.close());
  dialog.addEventListener("close", () => {
    closed = true;
    token = "";
    controller.abort();
    dialog.innerHTML = "";
    render();
  }, { once: true });
  dialog.showModal();
}

function openStreakFreezes(user, display) {
  if (settingsOpen()) return;
  renderId++;
  const dialog = document.getElementById("streak-freezes");
  const controller = new AbortController();
  let token = "", closed = false, busy = false;
  dialog.innerHTML = `<h3 id="freeze-title">Streak protection</h3>
    <p id="freeze-intro" class="intro">A little backup for ${esc(display)}'s study streak. Off by default.</p>
    <ul class="rules">
      <li><strong>Earn your ice.</strong> Start with 0 freezes. After opting in, finish all three daily quests to earn one per Anki day. Hold up to 3.</li>
      <li><strong>Keep your streak.</strong> While protection is on, one freeze is used automatically for each ended Anki day with no reviews.</li>
      <li><strong>Pause whenever you like.</strong> Turning it off pauses earning and use; saved freezes stay. Quests completed before you opt in do not earn freezes.</li>
    </ul>
    <div id="freeze-content"><form id="freeze-unlock">
      <label class="token-label" for="freeze-token">Your AnkiQuest token</label>
      <input id="freeze-token" type="password" required autocomplete="off" spellcheck="false" aria-describedby="freeze-token-help">
      <p id="freeze-token-help" class="token-help">Use the token from your AnkiQuest settings. It is kept only while this window is open.</p>
      <button type="submit" class="freeze-button primary">Load my settings</button>
    </form></div>
    <p id="freeze-status" class="status" role="status" aria-live="polite"></p>
    <div class="actions"><button type="button" id="freeze-close" class="freeze-button">Close</button></div>`;
  const content = dialog.querySelector("#freeze-content");
  const status = dialog.querySelector("#freeze-status");
  const say = (message, error = false) => {
    status.textContent = message;
    status.className = "status" + (error ? " error" : "");
  };
  const request = async body => {
    const response = await fetch("/api/streak-freezes/" + encodeURIComponent(user), {
      method: body === undefined ? "GET" : "POST",
      headers: { Authorization: "Bearer " + token, ...(body === undefined ? {} : { "Content-Type": "application/json" }) },
      ...(body === undefined ? {} : { body: JSON.stringify(body) }),
      cache: "no-store", signal: controller.signal,
    });
    if (!response.ok) {
      if (response.status === 401) throw new Error(body === undefined
        ? "That token was not accepted for this player. Check it and try again."
        : "That token is no longer accepted. Close and reopen this window to enter it again.");
      throw new Error("Could not load or save streak protection. Please try again.");
    }
    const data = await response.json();
    if (typeof data.enabled !== "boolean" || !Number.isInteger(data.freezes) || data.freezes < 0 || data.freezes > 3 || data.capacity !== 3) {
      throw new Error("The server returned unexpected freeze settings. Please try again.");
    }
    return data;
  };
  const showSettings = data => {
    content.innerHTML = `<form id="freeze-preferences">
      <div class="freeze-balance">${freezeSlots(data.freezes, data.enabled)}
        <div><strong>${data.freezes} of 3 freezes ${data.enabled ? "ready" : "saved"}</strong><span class="sub">${data.enabled ? data.freezes === 3 ? "Fully stocked" : "Earn more with daily quests" : "Protection is off"}</span></div></div>
      <label class="freeze-toggle" for="freeze-enabled">
        <input id="freeze-enabled" type="checkbox" role="switch" ${data.enabled ? "checked" : ""}>
        <span><strong>Use streak protection</strong><small>Earn and automatically use your freezes while on.</small></span>
      </label>
      <button type="submit" class="freeze-button primary">Save preference</button>
    </form>`;
    const form = content.querySelector("form");
    form.querySelector("#freeze-enabled").addEventListener("change", () => say("Unsaved change. Save to apply it."));
    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (busy || closed) return;
      busy = true;
      const enabled = form.querySelector("#freeze-enabled").checked;
      const controls = [...form.querySelectorAll("input, button")];
      controls.forEach(control => { control.disabled = true; });
      say("Saving…");
      try {
        const saved = await request({ enabled });
        if (!closed) {
          showSettings(saved);
          say(saved.enabled ? "Streak protection is on." : "Streak protection is off. Your saved freezes are kept.");
          content.querySelector("button").focus();
        }
      } catch (error) {
        if (!closed) say(error.message, true);
      } finally {
        busy = false;
        controls.forEach(control => { control.disabled = false; });
      }
    });
  };
  content.querySelector("form").addEventListener("submit", async event => {
    event.preventDefault();
    if (busy || closed) return;
    const input = dialog.querySelector("#freeze-token");
    token = input.value.trim();
    if (!token) { input.focus(); return; }
    input.value = "";
    busy = true;
    const button = event.target.querySelector("button");
    button.disabled = true;
    say("Loading settings…");
    try {
      const data = await request();
      if (!closed) { showSettings(data); say(""); content.querySelector("#freeze-enabled").focus(); }
    } catch (error) {
      token = "";
      if (!closed) { say(error.message, true); input.focus(); }
    } finally {
      busy = false;
      button.disabled = false;
    }
  });
  dialog.querySelector("#freeze-close").addEventListener("click", () => dialog.close());
  dialog.addEventListener("close", () => {
    closed = true;
    token = "";
    controller.abort();
    dialog.innerHTML = "";
    render().then(() => {
      if (!settingsOpen() && decodeURIComponent(location.hash.slice(1)) === user &&
          (document.activeElement === document.body || document.activeElement?.id === "manage-freezes")) {
        document.getElementById("manage-freezes")?.focus();
      }
    });
  }, { once: true });
  dialog.showModal();
}

async function render() {
  if (settingsOpen()) return;
  const id = ++renderId;
  const canRender = () => id === renderId && !settingsOpen();
  const user = decodeURIComponent(location.hash.slice(1));
  try {
    let me = "";
    try { me = localStorage.getItem("ankiquestPlayer") || ""; } catch (e) {}
    if (currentView() === "records") {
      const held = await fetch("/api/records").then(r => r.json());
      if (!canRender()) return;
      document.title = "ankiquest · records";
      app.innerHTML = `<header><h1>Records</h1>${me ? `<a href="#${encodeURIComponent(me)}">My profile</a>` : ""}</header>
        <section><h2>The best anyone has ever had</h2>${tabs("records")}${records(held, me)}</section>`;
      return;
    }
    const period = currentPeriod();
    const [rows, week] = await Promise.all([
      fetch("/api/leaderboard?period=" + period).then(r => r.json()),
      fetch("/api/week").then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    weekEnds = week?.ends_at ?? 0;
    if (user) {
      const res = await fetch("/api/profile/" + encodeURIComponent(user));
      if (res.ok) {
        const p = await res.json();
        if (!canRender()) return;
        document.title = `${p.display} · level ${p.level}`;
        try { localStorage.setItem("ankiquestPlayer", p.user); } catch (e) {}
        app.innerHTML = view(p, rows);
        document.getElementById("manage-decks").addEventListener("click", () => openDeckSharing(p.user, p.display));
        document.getElementById("manage-freezes").addEventListener("click", () => openStreakFreezes(p.user, p.display));
        return;
      }
    }
    if (!canRender()) return;
    document.title = "ankiquest";
    app.innerHTML = `<header><h1>ankiquest</h1>${me ? `<a href="#${encodeURIComponent(me)}">My profile</a>` : ""}</header><section><h2>${boardTitle(period)}</h2>${tabs(period)}${board(rows, me)}</section>`;
  } catch (e) {
    if (!canRender()) return;
    app.innerHTML = `<p class="empty">Could not reach the server.</p>`;
  }
}

addEventListener("hashchange", render);
document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && render());
setInterval(render, 30000);
render();
</script>
</body>
</html>
